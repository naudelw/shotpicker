[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "naudelw-shotpicker"
version = "0.1.0"
description = "按类别覆盖与难度分布，从候选池里选出让示例集覆盖最完整的最小组合"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "naudelw" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://naudelw.github.io"
Repository = "https://github.com/naudelw/shotpicker"
Issues = "https://github.com/naudelw/shotpicker/issues"

[project.scripts]
shotpicker = "shotpicker:main"

[tool.setuptools]
py-modules = ["shotpicker"]
